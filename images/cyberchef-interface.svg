<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Условная схема интерфейса CyberChef</title>
<desc id="desc">Слева расположена панель операций, в центре рецепт, справа сверху ввод, справа снизу вывод.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#edf2f8"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".10"/></filter>
</defs>
<rect width="1200" height="650" rx="28" fill="url(#bg)"/>
<text x="48" y="52" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#15233b">CyberChef — области интерфейса</text>
<text x="48" y="82" font-family="Arial, sans-serif" font-size="16" fill="#52627a">Условная учебная схема расположения основных областей (не скриншот).</text>
<rect x="40" y="112" width="270" height="490" rx="18" fill="#ffffff" stroke="#ccd6e5" filter="url(#shadow)"/>
<rect x="40" y="112" width="270" height="58" rx="18" fill="#dbeafe"/>
<rect x="40" y="150" width="270" height="20" fill="#dbeafe"/>
<text x="64" y="149" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#174ea6">Operations</text>
<rect x="60" y="188" width="230" height="42" rx="10" fill="#f1f5f9" stroke="#dbe3ef"/>
<text x="76" y="215" font-family="Arial, sans-serif" font-size="16" fill="#52627a">Поиск операции…</text>
<rect x="60" y="250" width="230" height="50" rx="10" fill="#eef6ff"/>
<text x="78" y="280" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">Encoding / decoding</text>
<rect x="60" y="312" width="230" height="50" rx="10" fill="#eef6ff"/>
<text x="78" y="342" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">Hashing</text>
<rect x="60" y="374" width="230" height="50" rx="10" fill="#eef6ff"/>
<text x="78" y="404" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">Data format</text>
<text x="60" y="460" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Категории и поиск</text>

<rect x="334" y="112" width="430" height="490" rx="18" fill="#ffffff" stroke="#ccd6e5" filter="url(#shadow)"/>
<rect x="334" y="112" width="430" height="58" rx="18" fill="#dcfce7"/>
<rect x="334" y="150" width="430" height="20" fill="#dcfce7"/>
<text x="358" y="149" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#166534">Recipe</text>
<text x="358" y="205" font-family="Arial, sans-serif" font-size="16" fill="#52627a">Операции выполняются сверху вниз</text>
<rect x="358" y="228" width="382" height="70" rx="12" fill="#effdf4" stroke="#86efac"/>
<circle cx="386" cy="263" r="16" fill="#16a34a"/><text x="381" y="269" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text>
<text x="414" y="260" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#166534">To Base64</text>
<text x="414" y="282" font-family="Arial, sans-serif" font-size="14" fill="#4b6b59">Кодирование входных данных</text>
<rect x="358" y="316" width="382" height="70" rx="12" fill="#effdf4" stroke="#86efac"/>
<circle cx="386" cy="351" r="16" fill="#16a34a"/><text x="381" y="357" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2</text>
<text x="414" y="348" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#166534">To Hex</text>
<text x="414" y="370" font-family="Arial, sans-serif" font-size="14" fill="#4b6b59">Следующее преобразование</text>
<rect x="358" y="415" width="382" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="7 5"/>
<text x="382" y="456" font-family="Arial, sans-serif" font-size="18" fill="#64748b">Перетащите операцию сюда</text>
<text x="358" y="542" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Параметры и порядок можно изменять</text>

<rect x="788" y="112" width="372" height="232" rx="18" fill="#ffffff" stroke="#ccd6e5" filter="url(#shadow)"/>
<rect x="788" y="112" width="372" height="58" rx="18" fill="#ffedd5"/>
<rect x="788" y="150" width="372" height="20" fill="#ffedd5"/>
<text x="812" y="149" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9a3412">Input</text>
<rect x="812" y="192" width="324" height="112" rx="12" fill="#fffaf5" stroke="#fed7aa"/>
<text x="832" y="226" font-family="Courier New, monospace" font-size="19" fill="#7c2d12">Hello CyberChef</text>
<text x="812" y="326" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">Исходный текст или файл</text>

<rect x="788" y="370" width="372" height="232" rx="18" fill="#ffffff" stroke="#ccd6e5" filter="url(#shadow)"/>
<rect x="788" y="370" width="372" height="58" rx="18" fill="#ede9fe"/>
<rect x="788" y="408" width="372" height="20" fill="#ede9fe"/>
<text x="812" y="407" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#5b21b6">Output</text>
<rect x="812" y="450" width="324" height="112" rx="12" fill="#faf8ff" stroke="#ddd6fe"/>
<text x="832" y="484" font-family="Courier New, monospace" font-size="18" fill="#5b21b6">SGVsbG8g...</text>
<text x="812" y="586" font-family="Arial, sans-serif" font-size="14" fill="#6d28d9">Результат обработки</text>
</svg>