<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Схема работы рецепта CyberChef</title>
<desc id="desc">Входные данные поступают в первую операцию, затем последовательно преобразуются другими операциями, после чего отображается результат.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#eef2ff"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/></marker>
</defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<text x="46" y="56" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#15233b">Как работает рецепт</text>
<text x="46" y="87" font-family="Arial, sans-serif" font-size="16" fill="#52627a">Каждая операция получает результат предыдущего шага.</text>

<rect x="40" y="170" width="220" height="160" rx="18" fill="#fff7ed" stroke="#fdba74" filter="url(#shadow)"/>
<text x="150" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9a3412">Input</text>
<text x="150" y="250" text-anchor="middle" font-family="Courier New, monospace" font-size="18" fill="#7c2d12">Hello CyberChef</text>
<text x="150" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#9a3412">Входные данные</text>

<line x1="263" y1="250" x2="315" y2="250" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

<rect x="326" y="170" width="220" height="160" rx="18" fill="#effdf4" stroke="#86efac" filter="url(#shadow)"/>
<circle cx="354" cy="198" r="16" fill="#16a34a"/><text x="349" y="204" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text>
<text x="436" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#166534">To Base64</text>
<text x="436" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b6b59">Кодирование</text>
<text x="436" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b6b59">первый шаг</text>

<line x1="549" y1="250" x2="601" y2="250" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

<rect x="612" y="170" width="220" height="160" rx="18" fill="#effdf4" stroke="#86efac" filter="url(#shadow)"/>
<circle cx="640" cy="198" r="16" fill="#16a34a"/><text x="635" y="204" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2</text>
<text x="722" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#166534">To Hex</text>
<text x="722" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b6b59">Преобразование</text>
<text x="722" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b6b59">второй шаг</text>

<line x1="835" y1="250" x2="887" y2="250" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

<rect x="898" y="170" width="262" height="160" rx="18" fill="#f5f3ff" stroke="#c4b5fd" filter="url(#shadow)"/>
<text x="1029" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#5b21b6">Output</text>
<text x="1029" y="250" text-anchor="middle" font-family="Courier New, monospace" font-size="18" fill="#5b21b6">Результат</text>
<text x="1029" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6d28d9">Итог рецепта</text>

<rect x="40" y="378" width="1120" height="82" rx="16" fill="#ffffff" stroke="#d7deea"/>
<text x="66" y="411" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">Порядок имеет значение</text>
<text x="66" y="438" font-family="Arial, sans-serif" font-size="16" fill="#52627a">Если изменить порядок операций или их параметры, изменится итоговый результат.</text>
</svg>